# SonarQube project configuration — WO-085
# Quality gate must pass; new-code coverage and critical issue thresholds are blocking.

sonar.projectKey=travel-platform
sonar.projectName=Travel Platform
sonar.projectVersion=1.0

# ── Source ────────────────────────────────────────────────────────────────────
# Scan all TypeScript sources across services, packages, shared, and tools.
sonar.sources=services,packages,shared,tools,frontend
sonar.tests=services,packages,shared,tools,frontend
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
sonar.exclusions=**/node_modules/**,**/dist/**,**/.turbo/**,**/coverage/**,**/build/**,**/*.d.ts,**/prisma/migrations/**

# ── Language ──────────────────────────────────────────────────────────────────
sonar.language=ts
sonar.typescript.tsconfigPath=tsconfig.base.json

# ── Coverage ──────────────────────────────────────────────────────────────────
# Merged coverage summary produced by tools/ci/merge-coverage.ts in build:node.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/fixtures/**,**/test/**

# ── Quality gate thresholds (must match the SonarQube server gate) ────────────
# These properties document the expected thresholds; the actual enforcement
# lives in the SonarQube server quality gate configuration.
#   New code coverage:        >= 60%   (matches COVERAGE_THRESHOLD env var)
#   New critical issues:      0
#   New blocker issues:       0
#   New security hotspots:    0 unreviewed
#   Duplicated lines:         <= 3%

# ── SARIF output ──────────────────────────────────────────────────────────────
# Enable SARIF export so findings appear in the pipeline artefacts.
sonar.sarifReportPaths=sonar-report.sarif
