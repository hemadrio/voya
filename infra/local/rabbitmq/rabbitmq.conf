## RabbitMQ local development configuration
## Loaded by the rabbitmq container via volume mount.

# Load exchange/queue/binding topology from definitions file.
# This pre-declares the travel.events topology so services start without
# asserting resources on first connection.
management.load_definitions = /etc/rabbitmq/definitions.json

# Allow guest login from any address in the local dev network.
loopback_users.guest = false

# Logging: info level locally; services that need trace can override per-container.
log.console.level = info
