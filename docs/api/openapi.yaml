{
  "components": {
    "responses": {
      "Forbidden": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        },
        "description": "Authenticated user does not own this resource"
      },
      "LifecycleConflict": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        },
        "description": "The requested state transition is not permitted from the current booking status"
      },
      "NotFound": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        },
        "description": "Resource not found"
      },
      "RateLimited": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        },
        "description": "Too many requests — see Retry-After header",
        "headers": {
          "Retry-After": {
            "description": "Seconds until the rate limit resets",
            "schema": {
              "type": "integer"
            }
          }
        }
      },
      "SupplierRejected": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        },
        "description": "The upstream supplier rejected the booking or payment — re-consent or retry required"
      },
      "SupplierTimeout": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        },
        "description": "Upstream supplier did not respond within the configured timeout"
      },
      "SupplierUnavailable": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        },
        "description": "Upstream supplier returned an unexpected error (5xx or timeout)"
      },
      "Unauthenticated": {
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        },
        "description": "Missing or invalid access token or session cookie"
      },
      "ValidationFailed": {
        "content": {
          "application/json": {
            "example": {
              "error": {
                "code": "VALIDATION_FAILED",
                "field": "origin",
                "message": "Airport code must be a valid 3-letter IATA code"
              },
              "reference": "01j3h4k-7f2a9b"
            },
            "schema": {
              "$ref": "#/components/schemas/ErrorEnvelope"
            }
          }
        },
        "description": "Request body or query parameters failed Zod schema validation"
      }
    },
    "schemas": {
      "ErrorEnvelope": {
        "additionalProperties": false,
        "description": "Platform-wide error envelope. The `reference` field equals the active X-Ray trace identifier so a traveler screenshot resolves directly to a trace. Present on all 4xx and 5xx responses.",
        "properties": {
          "error": {
            "additionalProperties": false,
            "properties": {
              "code": {
                "type": "string"
              },
              "field": {
                "type": "string"
              },
              "message": {
                "type": "string"
              }
            },
            "required": [
              "code",
              "message"
            ],
            "type": "object"
          },
          "reference": {
            "minLength": 1,
            "type": "string"
          }
        },
        "required": [
          "error",
          "reference"
        ],
        "type": "object"
      }
    },
    "securitySchemes": {
      "bearerAccessToken": {
        "bearerFormat": "JWT",
        "description": "Short-lived RS256 JWT (15-minute TTL) issued by auth-service. Claims: sub (userId), sid (sessionId), roles, jti.",
        "scheme": "bearer",
        "type": "http"
      },
      "sessionCookie": {
        "description": "HttpOnly Secure SameSite=Strict cookie. Set by the gateway on login and rotated on every refresh.",
        "in": "cookie",
        "name": "session",
        "type": "apiKey"
      }
    }
  },
  "info": {
    "description": "v1 REST API for the AI-powered multi-supplier travel booking platform. All error responses carry a `reference` field equal to the active X-Ray trace identifier, allowing support to pivot from a traveler screenshot to a trace. The `error.code` field is an ErrorCode enum value defined in @travel/contracts/errors.",
    "title": "Travel Platform v1 API",
    "version": "1.0.0"
  },
  "openapi": "3.1.0",
  "paths": {
    "/v1/auth/google/callback": {
      "post": {
        "operationId": "oauthGoogleCallback",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "additionalProperties": false,
                "properties": {
                  "code": {
                    "minLength": 1,
                    "type": "string"
                  },
                  "state": {
                    "minLength": 1,
                    "type": "string"
                  }
                },
                "required": [
                  "code",
                  "state"
                ],
                "type": "object"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "additionalProperties": false,
                  "properties": {
                    "accessToken": {
                      "minLength": 1,
                      "type": "string"
                    },
                    "expiresIn": {
                      "exclusiveMinimum": 0,
                      "type": "integer"
                    }
                  },
                  "required": [
                    "accessToken",
                    "expiresIn"
                  ],
                  "type": "object"
                }
              }
            },
            "description": "Google OAuth authentication successful"
          },
          "400": {
            "$ref": "#/components/responses/ValidationFailed"
          },
          "401": {
            "$ref": "#/components/responses/Unauthenticated"
          },
          "403": {
            "$ref": "#/components/responses/Forbidden"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "409": {
            "$ref": "#/components/responses/LifecycleConflict"
          },
          "422": {
            "$ref": "#/components/responses/SupplierRejected"
          },
          "429": {
            "$ref": "#/components/responses/RateLimited"
          },
          "502": {
            "$ref": "#/components/responses/SupplierUnavailable"
          },
          "504": {
            "$ref": "#/components/responses/SupplierTimeout"
          }
        },
        "security": [],
        "summary": "Exchange a Google OAuth2 authorization code for platform session tokens",
        "tags": [
          "auth"
        ]
      }
    },
