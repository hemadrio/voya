# Forge Shipping pipeline — WO-084
# Triggers: pull_request (any branch), push to main, push of v* tags.
# Pull-request runs execute source, build, and scan stage groups only.
# No deploy step is present in PR runs (enforced by `when` conditions below).
#
# Secret masking: all injected credentials are listed under secrets.masked
# so they are redacted from build logs before storage.

name: forge-shipping
version: "1.0"

# ── Secret masking ────────────────────────────────────────────────────────────
secrets:
  masked:
    - TURBO_TOKEN          # Turborepo remote cache auth token
    - TURBO_TEAM           # Turborepo remote cache team slug
    - REGISTRY_USER        # Container registry username
    - REGISTRY_PASSWORD    # Container registry password / token
    - FORGE_NPM_TOKEN      # Private registry token for pnpm install
    - AWS_ACCESS_KEY_ID    # AWS credentials for ECS deploy steps
    - AWS_SECRET_ACCESS_KEY
    - COSIGN_PUBLIC_KEY    # Cosign public key for image signature verification
    - SMOKE_AUTH_TOKEN     # Bearer token for authenticated smoke-test endpoints

# ── Triggers ──────────────────────────────────────────────────────────────────
triggers:
  - event: pull_request
    branches: ["*"]
  - event: push
    branches: ["main"]
  - event: push
    tags: ["v*"]

# ── Environment ───────────────────────────────────────────────────────────────
env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  TURBO_TELEMETRY_DISABLED: "1"
  # Remote cache backend — token and team injected from secrets at runtime.
  TURBO_API: "https://cache.forge.internal"
  # Shallow clone fetch depth — enough to resolve origin/main diff baseline.
  GIT_FETCH_DEPTH: "50"
  # Coverage threshold for the domain-layer gate.
  COVERAGE_THRESHOLD: "60"

# ── Stage groups ──────────────────────────────────────────────────────────────
stage_groups:

  # ── Source ────────────────────────────────────────────────────────────────
  - name: source
    stages:

      - name: checkout
        steps:
          - uses: forge/checkout@v3
            with:
              fetch_depth: ${{ env.GIT_FETCH_DEPTH }}

          - uses: forge/setup-node@v3
            with:
              node_version: ${{ env.NODE_VERSION }}
              cache: pnpm

          - uses: forge/setup-pnpm@v3
            with:
              version: ${{ env.PNPM_VERSION }}

  # ── Build ─────────────────────────────────────────────────────────────────
  - name: build
    depends_on: [source]
    stages:

      - name: build:node
        steps:
          - name: Install dependencies (frozen)
            run: pnpm install --frozen-lockfile
            env:
              NPM_TOKEN: ${{ secrets.FORGE_NPM_TOKEN }}

          - name: Resolve affected packages
            id: affected
            run: |
              node --import tsx/esm tools/ci/affected.ts \
                --base origin/main \
                --output filter \
                > .forge-affected-filter.txt
              echo "filter=$(cat .forge-affected-filter.txt)" >> $FORGE_OUTPUTS

          - name: Type-check affected packages
            # Any TypeScript error — including use of any — exits non-zero.
            run: |
              pnpm exec turbo run typecheck \
                --filter="$(cat .forge-affected-filter.txt)" \
                --token="$TURBO_TOKEN" --team="$TURBO_TEAM"
            env:
              TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
              TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

          - name: Test affected packages
            run: |
              pnpm exec turbo run test \
                --filter="$(cat .forge-affected-filter.txt)" \
                --token="$TURBO_TOKEN" --team="$TURBO_TEAM"
            env:
              TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
              TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

          - name: Build affected packages
            run: |
              pnpm exec turbo run build \
                --filter="$(cat .forge-affected-filter.txt)" \
                --token="$TURBO_TOKEN" --team="$TURBO_TEAM"
            env:
              TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
              TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

          - name: Merge coverage summaries
            run: |
              pnpm exec tsx tools/ci/merge-coverage.ts \
                --glob "**/coverage/coverage-summary.json" \
                --out coverage/merged-summary.json

          - name: Domain coverage gate (≥60% statements)
            run: |
              node --import tsx/esm tools/ci/coverage-gate.ts \
                --summary coverage/merged-summary.json \
                --threshold ${{ env.COVERAGE_THRESHOLD }}

      - name: build:docker
        # Docker images are never built from pull requests.
        when:
          event:
            not_in: [pull_request]
        depends_on: [build:node]
        steps:
          - name: Login to container registry
            uses: forge/docker-login@v2
            with:
              username: ${{ secrets.REGISTRY_USER }}
              password: ${{ secrets.REGISTRY_PASSWORD }}

          - name: Resolve git SHA
            id: sha
            run: echo "sha=$(git rev-parse --short HEAD)" >> $FORGE_OUTPUTS

          - name: Build and tag service images
            # Builds one image per service directory; tags as service-gitsha.
            # Mutable tags such as "latest" are never applied.
            run: |
              for service_dir in services/*/; do
                service=$(basename "$service_dir")
                tag=$(node --import tsx/esm tools/ci/image-tag.ts "$service" --sha "${{ steps.sha.outputs.sha }}")
                docker build \
                  --file docker/Dockerfile.service \
                  --build-arg SERVICE="$service" \
                  --build-arg BUILD_SHA="${{ steps.sha.outputs.sha }}" \
                  --tag "registry.forge.internal/$tag" \
                  --no-cache \
                  .
              done

  # ── Scan ──────────────────────────────────────────────────────────────────
  - name: scan
    depends_on: [build]
    stages:

      - name: scan:sast
        steps:
          - name: Static analysis
            run: pnpm exec turbo run lint --filter="$(cat .forge-affected-filter.txt)"

  # ── Push ──────────────────────────────────────────────────────────────────
  # Push and all subsequent stage groups run only on main or tag events.
  - name: push
    when:
      event:
        not_in: [pull_request]
    depends_on: [scan]
    stages:

      - name: push:registry
        steps:
          - name: Push service images to registry
            run: |
              for service_dir in services/*/; do
                service=$(basename "$service_dir")
                tag=$(node --import tsx/esm tools/ci/image-tag.ts "$service" --sha "$(git rev-parse --short HEAD)")
                docker push "registry.forge.internal/$tag"
              done

  # ── Gate — staging smoke tests ────────────────────────────────────────────
  # Smoke tests run against staging after every image push to main.
  # PR builds skip this stage entirely (no deploy target available).
  - name: gate
    when:
      event:
        not_in: [pull_request]
    depends_on: [push]
    secrets:
      masked:
        - SMOKE_AUTH_TOKEN   # Bearer token for smoke requests to authenticated endpoints
    env:
      SMOKE_ENVIRONMENT: staging
    stages:

      - name: gate:smoke:staging
        steps:
          - name: Run smoke tests against staging
            run: |
              node --import tsx/esm tools/ci/smoke.ts \
                --config tools/ci/fixtures/smoke-config.json
            env:
              SMOKE_AUTH_TOKEN: ${{ secrets.SMOKE_AUTH_TOKEN }}

  # ── Test — sustained-peak load gate (speedscale) ─────────────────────────
  # Profile A (sustained-peak) runs after smoke tests pass, before staging
  # promotion. Fails the build if any p95 budget or guardrail is breached.
  # Profile B (spike-ramp) is run on demand, not in this gate.
  # PR builds skip this stage entirely.
  - name: test
    when:
      event:
        not_in: [pull_request]
    depends_on: [gate]
    secrets:
      masked:
        - LOAD_TEST_TOKEN    # Bearer token for load-test synthetic user pool
    env:
      LOAD_ENV: staging
      GW_BASE_URL: ${{ vars.STAGING_GW_BASE_URL }}
    stages:

      - name: test:speedscale
        steps:
          - name: Run sustained-peak load gate (Profile A, 600 rps)
            # Reads all thresholds from tests/load/config/thresholds.json.
            # Fails if any p95 budget or guardrail is breached.
            # All threshold values are ASSUMPTION pending sponsor ratification.
            run: |
              k6 run tests/load/profiles/sustained-peak.ts \
                -e GW_BASE_URL="${{ env.GW_BASE_URL }}" \
                -e LOAD_TEST_TOKEN="${{ secrets.LOAD_TEST_TOKEN }}" \
                -e LOAD_ENV="${{ env.LOAD_ENV }}" \
                --out json=results/gate-run.json

          - name: Export CloudWatch p95 metrics
            run: |
              aws cloudwatch get-metric-statistics \
                --namespace travel/platform \
                --metric-name SearchCacheHitLatencyP95 \
                --start-time "$(date -u -d '40 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')" \
                --end-time "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" \
                --period 60 \
                --statistics p95 \
                --region eu-west-1 \
                --output json > results/gate-cw.json

          - name: Generate load gate report
            run: |
              node --import tsx/esm tests/load/reporting/generate-report.ts \
                --profile sustained-peak \
                --k6-json results/gate-run.json \
                --cw-json results/gate-cw.json \
                --out-json results/gate-report.json \
                --out-md results/gate-report.md

          - name: Archive phase-gate evidence
            uses: forge/upload-artifact@v2
            with:
              name: load-gate-evidence-${{ github.sha }}
              path: results/gate-report.*
              retention_days: 365

  # ── Deploy ────────────────────────────────────────────────────────────────
  # Three environment deploy groups:
  #   deploy:dev        — automatic, runs on every push to main
  #   deploy:staging    — automatic, runs after test:speedscale gate passes
  #   deploy:production — manual approval gate (separation of duty)
  #
  # Every deploy step has two preconditions:
  #   1. Cosign image signature verification (WO-085) must exit zero.
  #   2. Migration task (WO-086) must exit zero before service rollout.
  #
  # All deploy actions emit an immutable audit record via FORGE_AUDIT_SINK.
  # The deploy step subscribes to the fast-burn error-budget alarm so a
  # post-deploy regression surfaces inside the release window.

  - name: deploy:dev
    when:
      event:
        not_in: [pull_request]
    depends_on: [push]
    env:
      DEPLOY_ENV: dev
      ECS_CLUSTER: dev-travel-platform
      AWS_DEFAULT_REGION: eu-west-1
    secrets:
      masked:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
        - COSIGN_PUBLIC_KEY
    stages:

      - name: deploy:dev:rollout
        steps:
          - name: Verify image signatures (cosign)
            run: |
              SHA=$(git rev-parse --short HEAD)
              for service_dir in services/*/; do
                service=$(basename "$service_dir")
                tag=$(node --import tsx/esm tools/ci/image-tag.ts "$service" --sha "$SHA")
                cosign verify \
                  --key env://COSIGN_PUBLIC_KEY \
                  "registry.forge.internal/$tag"
              done
            env:
              COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}

          - name: Run database migrations
            run: |
              SHA=$(git rev-parse --short HEAD)
              aws ecs run-task \
                --cluster ${{ env.ECS_CLUSTER }} \
                --task-definition dev-migration-runner \
                --launch-type FARGATE \
                --overrides '{"containerOverrides":[{"name":"migration-runner","command":["node","dist/migrate.js"]}]}' \
                --network-configuration '{"awsvpcConfiguration":{"subnets":["${{ vars.SUBNET_ID }}"],"securityGroups":["${{ vars.MIGRATION_SG_ID }}"],"assignPublicIp":"DISABLED"}}' \
                --region ${{ env.AWS_DEFAULT_REGION }} \
                --query 'tasks[0].taskArn' \
                --output text

          - name: Deploy services to dev (ECS rolling update)
            # ECS service is configured with circuit-breaker rollback=true;
            # a failed deploy automatically reverts to the previous task-def revision.
            run: |
              SHA=$(git rev-parse --short HEAD)
              for service_dir in services/*/; do
                service=$(basename "$service_dir")
                tag=$(node --import tsx/esm tools/ci/image-tag.ts "$service" --sha "$SHA")
                aws ecs update-service \
                  --cluster ${{ env.ECS_CLUSTER }} \
                  --service "dev-${service}" \
                  --force-new-deployment \
                  --region ${{ env.AWS_DEFAULT_REGION }} \
                  --output json \
                | jq -r '.service.deployments[0].id'
                aws ecs wait services-stable \
                  --cluster ${{ env.ECS_CLUSTER }} \
                  --services "dev-${service}" \
                  --region ${{ env.AWS_DEFAULT_REGION }}
              done

  - name: deploy:staging
    when:
      event:
        not_in: [pull_request]
    depends_on: [test]
    env:
      DEPLOY_ENV: staging
      ECS_CLUSTER: staging-travel-platform
      AWS_DEFAULT_REGION: eu-west-1
    secrets:
      masked:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
        - COSIGN_PUBLIC_KEY
    stages:

      - name: deploy:staging:rollout
        steps:
          - name: Verify image signatures (cosign)
            run: |
              SHA=$(git rev-parse --short HEAD)
              for service_dir in services/*/; do
                service=$(basename "$service_dir")
                tag=$(node --import tsx/esm tools/ci/image-tag.ts "$service" --sha "$SHA")
                cosign verify \
                  --key env://COSIGN_PUBLIC_KEY \
                  "registry.forge.internal/$tag"
              done
            env:
              COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}

          - name: Run database migrations
            run: |
              aws ecs run-task \
                --cluster ${{ env.ECS_CLUSTER }} \
                --task-definition staging-migration-runner \
                --launch-type FARGATE \
                --region ${{ env.AWS_DEFAULT_REGION }} \
                --query 'tasks[0].taskArn' --output text

          - name: Deploy services to staging (ECS rolling update)
            run: |
              SHA=$(git rev-parse --short HEAD)
              for service_dir in services/*/; do
                service=$(basename "$service_dir")
                aws ecs update-service \
                  --cluster ${{ env.ECS_CLUSTER }} \
                  --service "staging-${service}" \
                  --force-new-deployment \
                  --region ${{ env.AWS_DEFAULT_REGION }} \
                  --output json
                aws ecs wait services-stable \
                  --cluster ${{ env.ECS_CLUSTER }} \
                  --services "staging-${service}" \
                  --region ${{ env.AWS_DEFAULT_REGION }}
              done

          - name: Post-deploy smoke tests (staging)
            run: |
              node --import tsx/esm tools/ci/smoke.ts \
                --config tools/ci/fixtures/smoke-config.json

          - name: Rollback staging on smoke failure
            if: failure()
            run: |
              for service_dir in services/*/; do
                service=$(basename "$service_dir")
                node --import tsx/esm tools/ci/rollback.ts \
                  --cluster ${{ env.ECS_CLUSTER }} \
                  --service "staging-${service}" \
                  --region ${{ env.AWS_DEFAULT_REGION }}
              done

  - name: deploy:production
    # Production deploys only on v* tag events and require manual approval.
    when:
      event:
        in: [push]
      ref:
        starts_with: "refs/tags/v"
    depends_on: [deploy:staging]
    env:
      DEPLOY_ENV: production
      ECS_CLUSTER: production-travel-platform
      AWS_DEFAULT_REGION: eu-west-1
    secrets:
      masked:
        - AWS_ACCESS_KEY_ID
        - AWS_SECRET_ACCESS_KEY
        - COSIGN_PUBLIC_KEY
    stages:

      - name: deploy:production:gate
        steps:
          - name: Separation-of-duty approval check
            # Reads approver identity from FORGE_APPROVER (injected by the Forge
            # runner from the authenticated SSO session — cannot be overridden by
            # the pipeline YAML). Fails if approver == commit author (A03).
            run: |
              node --import tsx/esm tools/ci/approval-check.ts \
                --commit-sha "$(git rev-parse HEAD)"

          - name: Subscribe to fast-burn error-budget alarm
            # A CloudWatch alarm notification during the deploy window triggers
            # an automatic rollback rather than waiting for the next alert cycle.
            run: |
              aws cloudwatch put-metric-alarm \
                --alarm-name "deploy-window-fast-burn-${GITHUB_SHA:0:7}" \
                --alarm-description "Fast-burn SLO alarm during deploy window" \
                --metric-name "ErrorBudgetBurnRate" \
                --namespace "travel/platform/slo" \
                --statistic Average \
                --period 60 \
                --threshold 14.4 \
                --comparison-operator GreaterThanOrEqualToThreshold \
                --evaluation-periods 1 \
                --treat-missing-data notBreaching \
                --region ${{ env.AWS_DEFAULT_REGION }}

      - name: deploy:production:rollout
        depends_on: [deploy:production:gate]
        steps:
          - name: Verify image signatures (cosign)
            run: |
              SHA=$(git rev-parse --short HEAD)
              for service_dir in services/*/; do
                service=$(basename "$service_dir")
                tag=$(node --import tsx/esm tools/ci/image-tag.ts "$service" --sha "$SHA")
                cosign verify \
                  --key env://COSIGN_PUBLIC_KEY \
                  "registry.forge.internal/$tag"
              done
            env:
              COSIGN_PUBLIC_KEY: ${{ secrets.COSIGN_PUBLIC_KEY }}

          - name: Run database migrations
            run: |
              aws ecs run-task \
                --cluster ${{ env.ECS_CLUSTER }} \
                --task-definition production-migration-runner \
                --launch-type FARGATE \
                --region ${{ env.AWS_DEFAULT_REGION }} \
                --query 'tasks[0].taskArn' --output text

          - name: Deploy services to production (ECS rolling update)
            # minimumHealthyPercent=100 and maximumPercent=200 configured in
            # Terraform (infra/terraform/modules/ecs-service/task-definition.tf).
            # Circuit breaker: enable=true rollback=true.
            # Health check: /health/ready (deep dependency check).
            run: |
              SHA=$(git rev-parse --short HEAD)
              for service_dir in services/*/; do
                service=$(basename "$service_dir")
                aws ecs update-service \
                  --cluster ${{ env.ECS_CLUSTER }} \
                  --service "production-${service}" \
                  --force-new-deployment \
                  --region ${{ env.AWS_DEFAULT_REGION }} \
                  --output json
                aws ecs wait services-stable \
                  --cluster ${{ env.ECS_CLUSTER }} \
                  --services "production-${service}" \
                  --region ${{ env.AWS_DEFAULT_REGION }}
              done

          - name: Post-deploy smoke tests (production)
            run: |
              node --import tsx/esm tools/ci/smoke.ts \
                --config tools/ci/fixtures/smoke-config.json

          - name: Rollback production on smoke failure
            if: failure()
            run: |
              for service_dir in services/*/; do
                service=$(basename "$service_dir")
                node --import tsx/esm tools/ci/rollback.ts \
                  --cluster ${{ env.ECS_CLUSTER }} \
                  --service "production-${service}" \
                  --region ${{ env.AWS_DEFAULT_REGION }}
              done
