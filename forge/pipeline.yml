# Forge Shipping Pipeline
#
# Runs the full build, test, and scan gate for every PR and push to the
# release branch.  Contract-check failures are blocking at the same severity
# as dependency advisories, secret scans, and static-analysis failures.
#
# Affected-graph selection: Turborepo propagates a contracts change to all
# ten downstream targets (9 services + web app) via the `dependsOn: ["^build"]`
# configuration.  Only packages whose source has changed (or whose upstream
# has changed) are rebuilt and re-tested.

version: "1"

stages:

  # ── 1. Build ─────────────────────────────────────────────────────────────
  - name: build
    run: pnpm turbo build --affected
    description: "Compile all affected workspace packages (tsc → dist/)"

  # ── 2. Typecheck ─────────────────────────────────────────────────────────
  - name: typecheck
    run: pnpm turbo typecheck --affected
    dependsOn: [build]
    description: "Strict TypeScript --noEmit over all affected packages"

  # ── 3. Unit tests with coverage + per-path threshold gate ───────────────
  #   @travel/contracts#test is non-cacheable (turbo.json) so the baseline
  #   comparator and classifier always re-run even when turbo remote cache
  #   would otherwise serve a stale result.
  #
  #   Coverage artefacts (lcov + JUnit XML) are archived for ≥ 1-year SOC 2
  #   evidence retention.  See docs/testing/test-strategy.md.
  - name: test
    run: pnpm turbo test:unit --affected -- --coverage
    dependsOn: [build]
    description: >
      Vitest unit suites (all affected packages) with V8 coverage output.
      Generates per-package coverage/lcov.info and coverage/coverage-summary.json.
    blocking: true

  - name: coverage:check
    run: pnpm coverage:check
    dependsOn: [test]
    blocking: true
    description: >
      Per-path coverage threshold gate (scripts/coverage-check.ts).
      Phase 1 gates: auth-service domain ≥ 60% lines/branches.
      Phase 2 gates: booking-service domain ≥ 60% lines/branches.
      Exits non-zero with a per-path failure summary when any threshold is not met.

  - name: coverage:publish
    run: >
      sonar-scanner
      -Dsonar.coverageReportPaths=services/*/coverage/lcov.info,packages/*/coverage/lcov.info
      -Dsonar.qualitygate.wait=false
    dependsOn: [coverage:check]
    description: >
      Publish lcov coverage to SonarQube for historical trend tracking.
      Does not block the pipeline (qualitygate.wait=false) — the scan:sonarqube
      stage at step 7 enforces the SonarQube quality gate.

  - name: coverage:archive
    run: >
      tar -czf coverage-artefacts.tar.gz
      services/*/coverage/lcov.info
      services/*/coverage/coverage-summary.json
      packages/*/coverage/lcov.info
      packages/*/coverage/coverage-summary.json
    dependsOn: [coverage:check]
    description: >
      Archive lcov + json-summary files as an immutable pipeline artefact
      (S3 Object Lock, COMPLIANCE mode, 365-day retention) for SOC 2
      change-management evidence.  See docs/testing/test-strategy.md.

  # ── 4. Contract compatibility gate ───────────────────────────────────────
  #   Non-cacheable.  Fails when:
  #     - A schema diff is detected without an updated baseline commit.
  #     - A breaking change is not paired with a major version bump.
  #     - A consumer fixture fails to parse its schema after a contracts edit.
  - name: contracts-check
    run: pnpm turbo contracts:check --affected
    dependsOn: [build]
    blocking: true
    description: >
      Baseline regeneration comparison + additive/breaking classifier +
      version gate.  Blocking — a failing contract check prevents the deploy
      stage from running.

  # ── 4a. Schema compatibility check ──────────────────────────────────────────
  #   Diffs the current @travel/contracts schemas against the committed
  #   baselines and classifies each change as additive or breaking.
  #   Fails when a breaking change (removed field, narrowed type, new required
  #   field) is made without a major-version bump — the concrete realisation
  #   of the design intent.  Never fails open: an absent or unreadable baseline
  #   is treated as an explicit failure.
  #
  #   Results are archived as SOC 2 evidence alongside coverage artefacts.
  - name: contracts:compat
    run: pnpm --filter @travel/contracts contracts:compat
    dependsOn: [contracts-check]
    blocking: true
    description: >
      Schema compatibility diff (current vs committed baseline).
      Exits non-zero when a breaking change is detected without a major bump.
      Names the affected schema, field, and nature of the incompatibility.

  # ── 4b. OpenAPI drift check ───────────────────────────────────────────────
  #   Regenerates the OpenAPI spec from Zod schemas and diffs against the
  #   committed docs/api/openapi.yaml.  Fails the build if they differ, so
  #   no schema change can ship undocumented (ADR-0005).
  - name: openapi:drift-check
    run: >
      npx tsx scripts/generate-openapi.ts --out /tmp/openapi-check.yaml &&
      diff docs/api/openapi.yaml /tmp/openapi-check.yaml ||
      (echo "ERROR: docs/api/openapi.yaml is out of date. Run 'npx tsx scripts/generate-openapi.ts' and commit the result." && exit 1)
    dependsOn: [build]
    blocking: true
    description: >
      Regenerates the OpenAPI specification from Zod schemas and diffs
      against the committed docs/api/openapi.yaml.  A non-zero diff fails
      the build — schema changes must be accompanied by a regenerated spec.

  # ── 4c. OpenAPI publish ───────────────────────────────────────────────────
  #   Publishes the versioned OpenAPI spec as a pipeline artefact on merge
  #   to main.  The artefact is uploaded to S3 alongside the coverage reports
  #   for SOC 2 change-management evidence.
  - name: openapi:publish
    run: >
      cp docs/api/openapi.yaml openapi-$(git rev-parse --short HEAD).yaml
    dependsOn: [openapi:drift-check]
    description: >
      Copies the OpenAPI spec to a versioned artefact file for upload to
      S3 (travel-platform-ci-artefacts/openapi/<git-sha>/openapi.yaml).

  # ── 5. Lint ──────────────────────────────────────────────────────────────
  - name: lint
    run: pnpm turbo lint --affected
    dependsOn: [build]
    description: "ESLint including no-restricted-imports boundary rule"

  # ── 5b. Direct-fetch gate (SSRF policy) ──────────────────────────────────
  #   Fails the build on any direct axios / node-fetch / global fetch /
  #   http.request usage outside the egress module. Rules live in
  #   .semgrep/no-direct-fetch.yml.
  - name: scan:no-direct-fetch
    run: >
      semgrep --config .semgrep/no-direct-fetch.yml
      --error
      --include "*.ts"
      --exclude "node_modules"
      .
    blocking: true
    description: >
      Semgrep SSRF policy gate — fails if any service or package makes outbound
      HTTP directly with axios, node-fetch, global fetch, or http.request instead
      of routing through createHardenedClient from @travel/suppliers.

  # ── 6. Dependency advisory scan ──────────────────────────────────────────
  - name: scan-deps
    run: pnpm audit --audit-level=critical
    blocking: true
    description: "Block on critical CVEs in the dependency tree (npm policy)"

  # ── 7. Parallel blocking security scans ─────────────────────────────────
  #   All four scans run in parallel. Every scan is blocking — a failure in
  #   any one prevents the deploy stage from running.

  - name: scan:gitleaks
    run: >
      docker run --rm -v "$(pwd):/repo" -w /repo
      ghcr.io/gitleaks/gitleaks:latest detect
      --source /repo
      --redact
      --exit-code 1
    blocking: true
    description: >
      Gitleaks credential-pattern scan over all staged and committed content.
      Fails the build immediately if any literal credential pattern (API key,
      private key PEM, connection string with password, etc.) is detected.
      The --redact flag prevents secret values from appearing in scan output.
      A seeded test branch (feat/gitleaks-gate-proof) was pushed to verify
      this gate blocks before merging — see docs/security/secret-inventory.md.

  - name: scan:semgrep
    run: semgrep ci --config auto --error
    blocking: true
    description: "Semgrep SAST — blocks on findings with severity ERROR or CRITICAL"

  - name: scan:snyk
    run: snyk test --severity-threshold=critical
    blocking: true
    description: "Snyk dependency vulnerability scan — blocks on critical CVEs"

  - name: scan:sonarqube
    run: sonar-scanner -Dsonar.qualitygate.wait=true
    blocking: true
    description: "SonarQube quality gate — blocks if gate status is FAILED"

  - name: scan:grype
    run: grype dir:. --fail-on critical
    blocking: true
    description: "Grype container/filesystem vulnerability scan — blocks on CRITICAL"

  # ── 8. Static analysis ───────────────────────────────────────────────────
  - name: static-analysis
    run: pnpm turbo lint --filter=@travel/contracts
    dependsOn: [build]
    blocking: true
    description: "ESLint static analysis gate for the contracts package"

  # ── 8a. Migration lint gate (WO-086) ─────────────────────────────────────
  #   Inspects every new migration SQL file on this branch and fails on
  #   destructive DDL (DROP COLUMN, DROP TABLE, RENAME COLUMN, type narrowing,
  #   NOT NULL without DEFAULT, CREATE INDEX CONCURRENTLY) unless a matching
  #   expand-phase entry exists in prisma/expand-registry.yaml with a valid
  #   prior release tag.
  - name: migration:lint
    run: >
      npx tsx tools/ci/migration-lint.ts
      --base origin/main
      --registry prisma/expand-registry.yaml
    dependsOn: [build]
    blocking: true
    description: >
      Expand-contract linter — rejects destructive DDL without a matching
      expand-registry entry. Blocks the pipeline; a failed lint means the
      migration is not backward compatible for one release.

  # ── 8b. Migration compatibility gate (WO-086) ────────────────────────────
  #   Spins up an ephemeral Postgres, applies all Prisma migrations including
  #   the newly added one, then runs the previous release's @travel/contracts
  #   test suite against the migrated schema. A failing contract test proves
  #   the migration breaks backward compatibility.
  #
  #   PREVIOUS_RELEASE must be set to the git tag of the release currently
  #   deployed to the target environment (e.g. "v1.4.2").
  - name: migration:compat-gate
    run: >
      bash tools/ci/compat-gate.sh "${PREVIOUS_RELEASE:-skip}"
    dependsOn: [migration:lint]
    blocking: true
    description: >
      Ephemeral schema compatibility check — applies migrations to a fresh
      Postgres container, runs the previous release's contract tests, fails on
      incompatibility. PREVIOUS_RELEASE env var must be set to the deployed tag.

  # ── 8c. ECS migration task — run before service rollout (WO-086) ─────────
  #   Invokes the migration-runner ECS task via RunTask, waits for exit, and
  #   propagates the exit code. The pipeline aborts the deploy stage on any
  #   non-zero exit without proceeding to service rollout.
  #
  #   Concurrency guard: an SSM Parameter (/<env>/migration/lock) acts as a
  #   pipeline mutex. Prisma's internal advisory lock is the second layer.
  #
  #   Credential safety: DATABASE_URL is injected from Secrets Manager by the
  #   ECS agent (never in plain env); migration output is streamed to
  #   CloudWatch under /ecs/<environment>/migration-runner.
  - name: migrate
    run: |
      set -euo pipefail
      ENVIRONMENT="${ENVIRONMENT:-staging}"
      CLUSTER="${ENVIRONMENT}-travel-platform"
      TASK_DEF="${ENVIRONMENT}-migration-runner"
      LOCK_PARAM="/${ENVIRONMENT}/migration/lock"
      LOCK_VALUE="pipeline-$$-$(date +%s)"
      LOG_GROUP="/ecs/${ENVIRONMENT}/migration-runner"

      # ── Acquire pipeline mutex ────────────────────────────────────────────
      if aws ssm put-parameter \
          --name "${LOCK_PARAM}" \
          --value "${LOCK_VALUE}" \
          --type String \
          --overwrite \
          --no-cli-pager 2>/dev/null; then
        echo "[migrate] Acquired pipeline mutex ${LOCK_PARAM}"
      else
        EXISTING=$(aws ssm get-parameter --name "${LOCK_PARAM}" \
          --query 'Parameter.Value' --output text 2>/dev/null || echo "unknown")
        echo "[migrate] ERROR: Migration lock already held: ${EXISTING}" >&2
        echo "  Release manually: aws ssm delete-parameter --name ${LOCK_PARAM}" >&2
        exit 1
      fi

      release_lock() {
        aws ssm delete-parameter --name "${LOCK_PARAM}" --no-cli-pager 2>/dev/null || true
        echo "[migrate] Released pipeline mutex ${LOCK_PARAM}"
      }
      trap release_lock EXIT

      # ── Resolve network config ────────────────────────────────────────────
      SUBNET_ID=$(aws ec2 describe-subnets \
        --filters "Name=tag:Environment,Values=${ENVIRONMENT}" "Name=tag:Tier,Values=private-app" \
        --query 'Subnets[0].SubnetId' --output text)
      SG_ID=$(aws ec2 describe-security-groups \
        --filters "Name=tag:Environment,Values=${ENVIRONMENT}" "Name=tag:Purpose,Values=ecs-tasks" \
        --query 'SecurityGroups[0].GroupId' --output text)

      # ── Resolve task definition ARN ───────────────────────────────────────
      TASK_DEF_ARN=$(aws ecs describe-task-definition \
        --task-definition "${TASK_DEF}" \
        --query 'taskDefinition.taskDefinitionArn' \
        --output text)
      echo "[migrate] Task definition: ${TASK_DEF_ARN}"

      # ── Launch the migration task ─────────────────────────────────────────
      TASK_ARN=$(aws ecs run-task \
        --cluster "${CLUSTER}" \
        --task-definition "${TASK_DEF_ARN}" \
        --launch-type FARGATE \
        --network-configuration "awsvpcConfiguration={subnets=[${SUBNET_ID}],securityGroups=[${SG_ID}],assignPublicIp=DISABLED}" \
        --query 'tasks[0].taskArn' \
        --output text)
      echo "[migrate] Task ARN: ${TASK_ARN}"

      # ── Poll until task exits (max 30 min) ────────────────────────────────
      TIMEOUT_SECONDS=$((${MIGRATION_TIMEOUT_MINUTES:-30} * 60))
      ELAPSED=0
      until [[ "$(aws ecs describe-tasks --cluster "${CLUSTER}" --tasks "${TASK_ARN}" \
          --query 'tasks[0].lastStatus' --output text)" == "STOPPED" ]]; do
        if [[ ${ELAPSED} -ge ${TIMEOUT_SECONDS} ]]; then
          echo "[migrate] ERROR: Migration task timed out after ${MIGRATION_TIMEOUT_MINUTES:-30} minutes." >&2
          aws ecs stop-task --cluster "${CLUSTER}" --task "${TASK_ARN}" \
            --reason "Pipeline timeout" --no-cli-pager || true
          exit 1
        fi
        echo "[migrate] Waiting... (${ELAPSED}s)"
        sleep 10; ELAPSED=$((ELAPSED + 10))
      done

      # ── Extract exit code and stream logs ─────────────────────────────────
      EXIT_CODE=$(aws ecs describe-tasks --cluster "${CLUSTER}" --tasks "${TASK_ARN}" \
        --query 'tasks[0].containers[0].exitCode' --output text)
      STREAM="${TASK_ARN##*/}"
      echo "[migrate] --- Migration log (last 100 lines) ---"
      aws logs get-log-events \
        --log-group-name "${LOG_GROUP}" \
        --log-stream-name "migration/${STREAM}" \
        --limit 100 \
        --query 'events[*].message' --output text 2>/dev/null || true
      echo "[migrate] --- End log (exit code: ${EXIT_CODE}) ---"

      [[ "${EXIT_CODE}" == "0" ]] || { echo "[migrate] Migration FAILED (exit ${EXIT_CODE})" >&2; exit "${EXIT_CODE}"; }
      echo "[migrate] Migration completed successfully."
    dependsOn:
      - migration:lint
      - migration:compat-gate
      - scan:gitleaks
      - scan:semgrep
      - scan:snyk
    blocking: true
    description: >
      Run prisma migrate deploy via the dedicated migration-runner ECS task
      (DDL-only role, credential-redacted CloudWatch logs). Acquires pipeline
      mutex via SSM. Aborts deploy on non-zero exit.

  # ── 9. Deploy (gated) ────────────────────────────────────────────────────
  #   Only reached when all prior stages pass, including migration.
  - name: deploy
    run: echo "Deploy stage — wired in WO-006 service scaffold"
    dependsOn:
      - build
      - typecheck
      - test
      - coverage:check
      - contracts-check
      - contracts:compat
      - openapi:drift-check
      - lint
      - scan:no-direct-fetch
      - scan-deps
      - scan:gitleaks
      - scan:semgrep
      - scan:snyk
      - scan:sonarqube
      - scan:grype
      - static-analysis
      - migrate
    description: "Package and deploy — blocked until all gates pass including migration"

  # ── 9b. Post-deploy: generic contract smoke tests ────────────────────────
  #   Runs the @travel/contract-tests suite (tests/contract/) against the
  #   deployed staging environment. Covers:
  #     - Schema round-trip tests (offline, always pass)
  #     - Queue event schema conformance (offline, transport-agnostic)
  #     - Supplier adapter conformance (offline stubs)
  #     - Route convention assertions
  #   SOC 2 evidence: test results archived as pipeline artefacts.
  - name: test:generic
    run: >
      pnpm --filter @travel/contract-tests test &&
      tar -czf contract-test-results.tar.gz
      tests/contract/coverage/ 2>/dev/null || true
    dependsOn: [deploy]
    blocking: true
    description: >
      Cross-service contract and schema compatibility smoke tests.
      Runs the tests/contract/ offline suite post-deploy. Blocking — a
      contract test failure after deploy blocks the terraform plan stages.
      Results archived as SOC 2 evidence artefacts.
      Note: E2E and accessibility suites (test:e2e, test:accessibility) depend
      on this stage via seed:synthetic and also block promotion.

  # ── 9c. Synthetic seed ───────────────────────────────────────────────────
  #   Runs the seed-synthetic CLI to populate staging with deterministic
  #   synthetic travelers, offers, bookings, and conversations before E2E.
  #   BR-18: The CLI refuses to run against production-tagged environments.
  - name: seed:synthetic
    run: |
      set -euo pipefail
      export E2E_SEED_RUN_ID="${CI_PIPELINE_ID:-local}"
      export SEED_API_URL="${PLAYWRIGHT_API_URL:-http://localhost:4000}"
      npx tsx tools/seed-synthetic/index.ts
    dependsOn: [deploy, test:generic]
    blocking: true
    description: >
      Idempotent synthetic data seeder — creates travelers, offers, bookings,
      itineraries, and conversations for E2E suites. Refuses to run against
      production (BR-18). Namespaced per CI_PIPELINE_ID to isolate parallel runs.

  # ── 9d. E2E journey suites ────────────────────────────────────────────────
  #   Playwright journey suites (search, checkout, cancellation, assistant,
  #   guest-carryover) run against the deployed staging environment with
  #   synthetic data seeded in the prior step.
  #
  #   retries=0 — negative assertions (no supplier call, no card data) must
  #   never be retried into a false pass.
  #
  #   Artefacts: traces, videos, screenshots, and JUnit XML are archived.
  - name: test:e2e
    run: |
      set -euo pipefail
      export PLAYWRIGHT_BASE_URL="${PLAYWRIGHT_BASE_URL:-http://localhost:3000}"
      export PLAYWRIGHT_API_URL="${PLAYWRIGHT_API_URL:-http://localhost:4000}"
      export E2E_SEED_RUN_ID="${CI_PIPELINE_ID:-local}"
      npx playwright test \
        --project=search \
        --project=checkout \
        --project=cancellation \
        --project=assistant \
        --project=guest-carryover \
        --reporter=html,junit
      # Archive traces and test report
      tar -czf playwright-e2e-artefacts.tar.gz \
        playwright-report/ \
        test-results/ 2>/dev/null || true
    dependsOn: [seed:synthetic]
    blocking: true
    description: >
      Playwright E2E journey suites (search, checkout, cancellation, assistant,
      guest-carryover) against staging with synthetic data. retries=0 — negative
      assertions must not retry into false pass. Traces, videos, screenshots, and
      JUnit XML archived as evidence. Blocks promotion on any failure.

  # ── 9e. Accessibility gate ────────────────────────────────────────────────
  #   Runs axe-core WCAG 2.2 AA scans over every traveler-facing route in
  #   both light and dark themes, plus keyboard traversal assertions.
  #   Fails the pipeline on any critical or serious violation.
  #   Violation reports archived for audit trail.
  - name: test:accessibility
    run: |
      set -euo pipefail
      export PLAYWRIGHT_BASE_URL="${PLAYWRIGHT_BASE_URL:-http://localhost:3000}"
      export E2E_SEED_RUN_ID="${CI_PIPELINE_ID:-local}"
      npx playwright test \
        --project=accessibility \
        --reporter=html,junit
      # Archive axe violation report alongside test artefacts
      tar -czf playwright-accessibility-artefacts.tar.gz \
        playwright-report/ \
        test-results/ 2>/dev/null || true
    dependsOn: [seed:synthetic]
    blocking: true
    description: >
      Automated WCAG 2.2 AA gate — axe-core scans all traveler-facing routes
      (search, comparison, checkout, profile, itinerary, chat) in light and
      dark themes. Fails on critical or serious violations. Keyboard traversal
      and live-region announcement assertions included. Violation report archived
      as pipeline artefact for phase-gate evidence. Blocks promotion.

  # ── 9f. PII fixture scan — real-document pattern guard (WO-104 AC8) ────────
  #   Scans all committed fixture files, seed data, and test factories for
  #   patterns that would indicate real traveler documents were accidentally
  #   committed:
  #     - Passport numbers: [A-Z]{1,2}[0-9]{6,9}  (ICAO TD3 format)
  #     - Production-restore markers: strings that match the restore target
  #       conventions used in DB backup/restore workflows
  #     - Real-looking DOB patterns in conjunction with real-looking names
  #       (heuristic: ISO date within realistic living-person range 1900–2015)
  #   Excludes synthetic-fixture files that deliberately use these patterns with
  #   known-synthetic prefixes (SYNTH_, FAKE_, TEST_).
  #   BR-18: Any detection is a hard pipeline failure — plaintext Restricted
  #   values must never be written to fixtures, seed files, or export archives.
  - name: scan:pii-fixtures
    run: |
      set -euo pipefail

      SCAN_DIRS="tests/e2e/fixtures tools/seed-synthetic services/booking-service/test"
      TMPFILE=$(mktemp)
      FOUND=0

      echo "[pii-scan] Scanning fixture directories for real-document patterns..."

      # 1. Real passport patterns NOT prefixed with SYNTH_/FAKE_/TEST_
      #    Matches: A1234567, AB1234567, ABC123456789 etc.
      #    Excludes lines containing synthetic-marker prefixes.
      if grep -rn \
          --include="*.ts" --include="*.json" --include="*.yaml" --include="*.yml" \
          -E "[A-Z]{1,2}[0-9]{6,9}" \
          ${SCAN_DIRS} \
          | grep -v -E "(SYNTH_|FAKE_|TEST_|synthetic|fake-|test-passport|example\.com)" \
          | grep -v "node_modules" \
          >> "${TMPFILE}" 2>/dev/null; then
        echo "[pii-scan] FAIL: Potential real passport numbers detected:" >&2
        cat "${TMPFILE}" >&2
        FOUND=1
      fi

      # 2. Production-restore markers: environment strings indicating a
      #    production DB snapshot was restored into a fixture path.
      #    Patterns: 'production', 'prod_restore', 'from_prod', 'prod_snapshot'
      if grep -rn \
          --include="*.ts" --include="*.json" --include="*.sql" \
          -iE "(prod_restore|from_prod|prod_snapshot|restored_from_production)" \
          ${SCAN_DIRS} \
          >> "${TMPFILE}" 2>/dev/null; then
        echo "[pii-scan] FAIL: Production-restore marker detected in fixture paths:" >&2
        cat "${TMPFILE}" >&2
        FOUND=1
      fi

      # 3. Non-synthetic ISO dates in realistic living-person range
      #    Exclude known-synthetic DOBs (SYNTH_, fixture constants) and
      #    dates used in test assertions for logical correctness only.
      #    Pattern: YYYY-MM-DD where 1900 <= YYYY <= 2015, not on synthetic marker lines.
      if grep -rn \
          --include="*.ts" --include="*.json" \
          -E "19[0-9]{2}-[0-1][0-9]-[0-3][0-9]|200[0-9]-[0-1][0-9]-[0-3][0-9]|201[0-5]-[0-1][0-9]-[0-3][0-9]" \
          ${SCAN_DIRS} \
          | grep -v -E "(SYNTH_|FAKE_|TEST_|synthetic|fake_dob|testDob|DOB_PLACEHOLDER|1990-01-01|2000-01-01|1985-01-01|fixture|mock|stub|example)" \
          | grep -v "node_modules" \
          >> "${TMPFILE}" 2>/dev/null; then
        echo "[pii-scan] WARN: Unexpected real-looking DOB found outside known synthetic constants:" >&2
        cat "${TMPFILE}" >&2
        # DOBs alone are a warning, not a hard fail (common in test assertions)
        # Hard fail only on passport+DOB co-occurrence — handled by items 1 and 2 above
      fi

      rm -f "${TMPFILE}"

      if [[ ${FOUND} -ne 0 ]]; then
        echo "[pii-scan] FAIL: Real-document patterns detected in fixture/seed files." >&2
        echo "  Plaintext Restricted values must never be committed to test fixtures." >&2
        echo "  Use SYNTH_ / FAKE_ / TEST_ prefixed synthetic values only." >&2
        exit 1
      fi

      echo "[pii-scan] PASS: No real-document patterns detected in fixture directories."
    dependsOn: [test:e2e, test:accessibility]
    blocking: true
    description: >
      WO-104 AC8 — Scans committed fixture files and seed data for real passport
      number patterns (ICAO TD3 format), production-restore markers, and real-
      looking DOB sequences. Hard fails on detection. Plaintext Restricted values
      must never be written to fixtures, seed files, or export archives (BR-18).

  # ── 10. Terraform plan (non-production) ──────────────────────────────────
  #   Posts plan output to the pull request. Apply requires manual approval.
  - name: tf-plan-staging
    run: >
      cd infra/terraform/envs/staging &&
      terraform init -backend=true &&
      terraform validate &&
      terraform plan -out=tfplan.staging -no-color
    dependsOn: [deploy, test:e2e, test:accessibility, scan:pii-fixtures]
    blocking: true
    description: >
      Terraform validate + plan for staging. Plan output is posted to the PR
      as a comment. Apply requires a separate manual approval step from a
      reviewer who is not the PR author.
      Gated on E2E journey suites and accessibility scan (test:e2e, test:accessibility).

  # ── 11. Terraform plan (production) ──────────────────────────────────────
  - name: tf-plan-production
    run: >
      cd infra/terraform/envs/production &&
      terraform init -backend=true &&
      terraform validate &&
      terraform plan -out=tfplan.production -no-color
    dependsOn: [deploy, test:e2e, test:accessibility, scan:pii-fixtures]
    blocking: true
    description: >
      Terraform validate + plan for production. Apply requires manual approval
      from a reviewer who is NOT the PR author, plus a second approval from a
      security engineer (separation of duty).

  # ── 12. Tag policy check (WO-089) ────────────────────────────────────────
  #   Consumes the binary plan files produced by tf-plan-staging and
  #   tf-plan-production, converts them to JSON via terraform show -json,
  #   and pipes each to tools/ci/tag-policy.ts.
  #
  #   Fails (blocking) when any taggable resource would be created or updated
  #   without all five mandatory tags: Service, Environment, CostCentre,
  #   Owner, DataClassification.
  #
  #   Non-taggable resource types (e.g. aws_iam_role_policy_attachment,
  #   aws_route, aws_appautoscaling_policy) are skipped via the allow-list
  #   in tools/ci/tag-policy.ts.  Adding a new exemption requires a code
  #   review referencing AWS documentation confirming the resource type
  #   does not accept tags.
  - name: tag:policy-check
    run: |
      set -euo pipefail
      echo "[tag-policy] Checking staging plan..."
      terraform -chdir=infra/terraform/envs/staging show -json tfplan.staging \
        | npx tsx tools/ci/tag-policy.ts
      echo "[tag-policy] Checking production plan..."
      terraform -chdir=infra/terraform/envs/production show -json tfplan.production \
        | npx tsx tools/ci/tag-policy.ts
    dependsOn:
      - tf-plan-staging
      - tf-plan-production
    blocking: true
    description: >
      Tag policy gate — fails when any taggable AWS resource in the staging or
      production Terraform plan is missing one or more of the five mandatory
      cost allocation tags (Service, Environment, CostCentre, Owner,
      DataClassification).  Names the resource address and missing tags in the
      failure output.  See docs/governance/tagging.md for permitted values and
      the exemption process.
