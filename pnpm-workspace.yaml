packages:
  - "packages/*"
  - "services/*"
  - "frontend"
  - "tools/*"

# ── Dependency catalog ────────────────────────────────────────────────────────
# Single source of truth for every shared runtime and tooling dependency.
# Packages MUST reference catalogued entries with "catalog:" instead of a
# literal version string. Drift is enforced by tools/workspace-lint at CI time.
#
# To add a new shared dependency: add it here first, then reference "catalog:"
# in the consuming package. Justified exceptions use a named catalog below.
# ---------------------------------------------------------------------------

catalog:
  # ── Core runtime ──────────────────────────────────────────────────────────
  zod: "^3.23.8"
  pino: "^8.21.0"
  express: "^4.19.2"
  amqplib: "^0.10.4"
  ioredis: "^5.3.2"

  # ── AWS SDKs ──────────────────────────────────────────────────────────────
  "@aws-sdk/client-sqs": "^3.600.0"
  "@aws-sdk/client-secrets-manager": "^3.600.0"
  "@aws-sdk/client-ses": "^3.600.0"

  # ── Data / ORM ────────────────────────────────────────────────────────────
  "@prisma/client": "^5.16.1"
  prisma: "^5.16.1"

  # ── AI / Payment suppliers ────────────────────────────────────────────────
  "@anthropic-ai/sdk": "^0.24.3"
  stripe: "^16.2.0"

  # ── Web framework ─────────────────────────────────────────────────────────
  next: "^14.2.5"
  react: "^18.3.1"
  react-dom: "^18.3.1"

  # ── Observability ─────────────────────────────────────────────────────────
  "@opentelemetry/api": "^1.9.0"
  "@opentelemetry/sdk-node": "^0.53.0"
  "@opentelemetry/auto-instrumentations-node": "^0.49.1"
  "@opentelemetry/exporter-trace-otlp-http": "^0.53.0"

  # ── Tooling (shared across all packages) ──────────────────────────────────
  typescript: "5.5.3"
  vitest: "^1.6.0"
  jest: "^29.7.0"
  ts-jest: "^29.2.0"
  tsx: "^4.0.0"
  rimraf: "^5.0.7"

  # ── Lint / type-check tooling ─────────────────────────────────────────────
  eslint: "^8.57.0"
  "@typescript-eslint/eslint-plugin": "^7.16.0"
  "@typescript-eslint/parser": "^7.16.0"

  # ── Type stubs ────────────────────────────────────────────────────────────
  "@types/node": "^20.14.0"
  "@types/jest": "^29.5.12"
  "@types/amqplib": "^0.10.5"
  "@types/express": "^4.17.21"
